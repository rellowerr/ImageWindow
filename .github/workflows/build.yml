name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        id: build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageWindow-${{ matrix.config.name }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
