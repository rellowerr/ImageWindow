name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Mod
        uses: actions/checkout@v4

      - name: Download Geode CLI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/geode-sdk/cli/releases/download/v3.9.0/geode-cli-v3.9.0-win.zip" -OutFile "cli.zip"
          Expand-Archive -Path "cli.zip" -DestinationPath "$env:USERPROFILE\.geode-cli"
          "$env:USERPROFILE\.geode-cli" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Geode SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/geode-sdk/geode.git "$env:USERPROFILE\geode-sdk"
          & "$env:USERPROFILE\.geode-cli\geode.exe" profile add --name default "C:\Program Files (x86)\Steam\steamapps\common\Geometry Dash"
          & "$env:USERPROFILE\.geode-cli\geode.exe" sdk set-path "$env:USERPROFILE\geode-sdk"
          & "$env:USERPROFILE\.geode-cli\geode.exe" sdk install-binaries --platform win
          "GEODE_SDK=$env:USERPROFILE\geode-sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Mod
        shell: pwsh
        run: |
          geode build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageWindow-Windows
          path: build/*.geode
